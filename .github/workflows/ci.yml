name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data, run tests and build
        run: npm run check

      - name: Verify committed build is reproducible
        run: git diff --exit-code -- dist/index.html

      - name: Upload offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptcombo-dist
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
